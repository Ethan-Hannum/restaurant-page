<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Page</title>
</head>
<body>
    <header>
        <nav>
            <button id="home">Home</button>
            <button id="menu">Menu</button>
            <button id="about">About</button>
        </nav>
        <div id="logo">The Drunken Deer</div>
    </header>
    <div id="menu-content">
        <div id="menu-container">
            <h1>Menu</h1>
            <div class="menu-section">
                <h2>Appetizers</h2>
                <ul class="menu-list appetizers">
                    <li>Carpacio</li>
                    <li>Escargo</li>
                    <li>Calimari</li>
                    <li>Beef Tar Tar</li>
                    <li>Potato Skins</li>
                </ul>
            </div>
            <div class="menu-section">
                <h2>Main Course</h2>
                <ul class="menu-list main-course">
                    <li>Lobster Bisque</li>
                    <li>Filet Mignon</li>
                    <li>A5 Wagyu Steak</li>
                </ul>
            </div>
            <div class="menu-section">
                <h2>Dessert</h2>
                <ul class="menu-list dessert">
                    <li>Creme Brulee</li>
                    <li>Chocolate Souffle</li>
                </ul>
            </div>
        </div>
    </div>
</body>
</html>
